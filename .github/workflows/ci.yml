name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No build step: the package ships TypeScript source and Node's type
      # stripping runs it directly.
      - run: node --test tests/upstream/*.test.ts tests/dsh/*.test.ts